name: Check Migration Drift

# pull_request_target, not pull_request: with the plain `pull_request`
# trigger, GitHub loads and runs THIS FILE from the PR branch itself for
# same-repo PRs (only forks are denied secrets, not same-repo branches) --
# every `run`/`uses`/`env` line below was under the PR author's control,
# secrets and all, regardless of which script we happened to shell out to.
# pull_request_target always loads the workflow definition from the base
# branch (develop) instead, closing that off. The PR's own code is only
# ever read as data (see "Checkout PR migration files" below), never
# executed -- the trusted script is fetched from develop in its own step,
# same as before.
on:
  pull_request_target:
    branches: [develop]
    paths:
      - "supabase/migrations/**"

jobs:
  check-drift:
    name: Check E2E project migration drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # pull_request_target grants secrets to fork PRs too (its whole point is
    # running trusted workflow code against untrusted PR data) -- this guard
    # stays required, not just a fork-secrets nicety like it was under
    # `pull_request`. This repo has no external forks today; a maintainer
    # merging a fork PR should sync QA/E2E via workflow_dispatch on
    # migrate-qa-e2e.yml instead.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Base-branch checkout (develop) -- this is where the trusted script
      # comes from, not the PR.
      - name: Checkout base branch
        uses: actions/checkout@v7

      - name: Copy trusted drift-check script
        run: |
          cp scripts/check-migration-drift.sh "$RUNNER_TEMP/check-migration-drift.sh"
          chmod +x "$RUNNER_TEMP/check-migration-drift.sh"

      # PR head content, fetched into its own directory and never executed
      # or sourced -- only its supabase/migrations/*.sql files are read, by
      # the trusted script above, as inert data to diff against the linked
      # project's schema_migrations.
      - name: Checkout PR migration files
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          sparse-checkout: |
            supabase/migrations
          sparse-checkout-cone-mode: false

      - name: Use PR's migration files for the drift check
        run: |
          rm -rf supabase/migrations
          mv pr-head/supabase/migrations supabase/migrations
          rm -rf pr-head

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Link to E2E project (read-only check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.E2E_PROJECT_REF }}

      - name: Check for pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: bash "$RUNNER_TEMP/check-migration-drift.sh"
