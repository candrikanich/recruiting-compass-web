name: Check Migration Drift

on:
  pull_request:
    branches: [develop]
    paths:
      - "supabase/migrations/**"

jobs:
  check-drift:
    name: Check E2E project migration drift
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Link to E2E project (read-only check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.E2E_PROJECT_REF }}

      - name: Check for pending migrations
        run: bash scripts/check-migration-drift.sh
