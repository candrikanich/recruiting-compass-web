name: Check Migration Drift

on:
  pull_request:
    branches: [develop]
    paths:
      - "supabase/migrations/**"

jobs:
  check-drift:
    name: Check E2E project migration drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs don't get repo secrets (GitHub withholds them from
    # pull_request runs on forked code) — the E2E link step would hard-fail
    # before any comparison. Skip cleanly rather than failing opaquely; this
    # repo has no external forks today, but a maintainer merging a fork PR
    # should sync QA/E2E via workflow_dispatch on migrate-qa-e2e.yml instead.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # Checks out the PR head, including this repo having no external forks
      # today. Every same-repo branch push still reaches this job with
      # SUPABASE_ACCESS_TOKEN/E2E_DB_PASSWORD in env below -- an unreviewed
      # branch could otherwise edit scripts/check-migration-drift.sh to
      # exfiltrate them or hit the E2E project directly before merge. The
      # script that actually runs with those secrets is fetched from
      # `develop` (a separate step, below), never from this checkout.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch trusted drift-check script from develop
        run: |
          git fetch --depth=1 origin develop
          git show origin/develop:scripts/check-migration-drift.sh > "$RUNNER_TEMP/check-migration-drift.sh"
          chmod +x "$RUNNER_TEMP/check-migration-drift.sh"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Link to E2E project (read-only check)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: supabase link --project-ref ${{ secrets.E2E_PROJECT_REF }}

      # Local migration files under supabase/migrations/ come from the PR
      # checkout above (they're the data being checked for drift, never
      # executed) -- only the comparison script itself is the trusted copy.
      - name: Check for pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.E2E_DB_PASSWORD }}
        run: bash "$RUNNER_TEMP/check-migration-drift.sh"
