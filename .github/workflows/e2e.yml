name: E2E Tests

on:
  # PRs to develop (QA gate) and main (production gate)
  pull_request:
    branches: [develop, main]
  # Allow manual triggering from Actions tab
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the full test-database seed exactly once. global-setup.ts also seeds
  # per-run (shouldSeed), which is fine for a single job but not for 4 sharded
  # jobs hitting the same shared test project concurrently — seeding here and
  # passing E2E_SKIP_SEED=true to every downstream job avoids that race.
  e2e-seed:
    name: Seed E2E Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Seed test database
        run: npm run db:seed:test
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

  e2e-tests:
    name: Playwright E2E Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: e2e-seed
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Main chromium project only, sharded 4 ways — was a single ~50m runner.
    # cross-account-logout and profile-publish-toggle run once, unsharded, in
    # the separate e2e-sequential job below (they mutate shared account state
    # and must never run concurrently with a second copy of themselves).
    timeout-minutes: 30
    # Dependabot PRs don't have access to secrets — the server can't start without them.
    # Dependency bumps are validated by unit tests, lint, and type-check.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
        with:
          prepare-nuxt: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          # Override Vercel preset so nuxi preview can serve a standard Node.js
          # server in CI. Production builds use the Vercel preset (nuxt.config.ts).
          NITRO_PRESET: node-server
          # ssr:false bakes NUXT_PUBLIC_* into the client bundle at build time,
          # so the test project's URL/anon must be present here, not just at run.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      - name: Run E2E tests
        run: npm run test:e2e:main -- --shard=${{ matrix.shard }}/4
        env:
          CI: true
          E2E_SKIP_SEED: "true" # seeded once upstream in e2e-seed — see that job's comment
          # E2E runs against the dedicated test Supabase project, never prod.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          # Slug the seed publishes for the player's public profile — the
          # anonymous public-profile spec resolves /p/:slug against it.
          E2E_PROFILE_SLUG: e2e-test-player
          # Do NOT set NUXT_PUBLIC_ADMIN_HOST here. On the loopback E2E host the
          # app serves admin + main from one origin (see middleware/host.global
          # loopback carve-out); setting it to localhost makes every non-admin
          # page redirect to /admin and render blank.
          NUXT_ADMIN_TOKEN_SECRET: ${{ secrets.NUXT_ADMIN_TOKEN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  # cross-account-logout and profile-publish-toggle each mutate shared test-
  # account state (see comments in playwright.config.ts / scripts/run-e2e.sh)
  # and must run exactly once, never sharded, never concurrently with each
  # other. Runs alongside the e2e-tests matrix, not after it — it's ~10 specs,
  # nowhere near the main suite's wall time.
  e2e-sequential:
    name: Playwright E2E Tests (sequential)
    runs-on: ubuntu-latest
    needs: e2e-seed
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
        with:
          prepare-nuxt: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NITRO_PRESET: node-server
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      - name: Run E2E tests
        run: npm run test:e2e:sequential
        env:
          CI: true
          E2E_SKIP_SEED: "true" # seeded once upstream in e2e-seed — see that job's comment
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PROFILE_SLUG: e2e-test-player
          NUXT_ADMIN_TOKEN_SECRET: ${{ secrets.NUXT_ADMIN_TOKEN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-sequential
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-sequential
          path: test-results/
          retention-days: 30

  # Quarantined specs (tagged @flaky) — non-blocking. Reports failure rate
  # without gating merges; move a spec back once its root cause is fixed.
  # See planning/e2e-ci-refactor-plan.md Phase 3.
  e2e-flaky:
    name: Playwright E2E Tests (flaky, non-blocking)
    runs-on: ubuntu-latest
    needs: e2e-seed
    timeout-minutes: 15
    continue-on-error: true
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
        with:
          prepare-nuxt: "true"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NITRO_PRESET: node-server
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      - name: Run flaky-quarantined E2E tests
        run: npm run test:e2e:flaky
        env:
          CI: true
          E2E_SKIP_SEED: "true" # seeded once upstream in e2e-seed — see that job's comment
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PROFILE_SLUG: e2e-test-player
          NUXT_ADMIN_TOKEN_SECRET: ${{ secrets.NUXT_ADMIN_TOKEN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-flaky
          path: playwright-report/
          retention-days: 30

  # WebKit (Safari) — non-blocking; failures are reported but don't gate the PR.
  # Builds its own app instead of downloading e2e-tests' artifact so it starts
  # at T+0 instead of waiting out the ~50m chromium job first (both jobs were
  # non-dependent — WebKit only ever needed e2e-tests' build output, not its
  # test result).
  e2e-webkit:
    name: Playwright E2E Tests (WebKit/Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    continue-on-error: true
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
        with:
          prepare-nuxt: "true"

      - name: Install Playwright WebKit browser
        # chromium is also required: global-setup.ts captures auth storageState
        # via chromium.launch() (portable across browsers) before the webkit run.
        run: npx playwright install --with-deps webkit chromium

      - name: Build application
        run: npm run build
        env:
          # Override Vercel preset so nuxi preview can serve a standard Node.js
          # server in CI. Production builds use the Vercel preset (nuxt.config.ts).
          NITRO_PRESET: node-server
          # ssr:false bakes NUXT_PUBLIC_* into the client bundle at build time,
          # so the test project's URL/anon must be present here, not just at run.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      - name: Run E2E tests (WebKit only)
        # WebKit is substantially less stable under parallel load in CI
        # (timeouts + occasional “WebKit encountered an internal error”).
        # Run serially to reduce flakes and keep the signal actionable.
        #
        # This job is intentionally non-blocking (see header comment). We still
        # upload the Playwright report so failures are visible, but don't fail
        # the PR status on WebKit-only flakes/regressions.
        continue-on-error: true
        run: npm run test:e2e -- --project webkit --workers=1
        env:
          CI: true
          FULL_TESTS: "1"
          # E2E runs against the dedicated test Supabase project, never prod.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          # Slug the seed publishes for the player's public profile — the
          # anonymous public-profile spec resolves /p/:slug against it.
          E2E_PROFILE_SLUG: e2e-test-player
          # Do NOT set NUXT_PUBLIC_ADMIN_HOST here. On the loopback E2E host the
          # app serves admin + main from one origin (see middleware/host.global
          # loopback carve-out); setting it to localhost makes every non-admin
          # page redirect to /admin and render blank.
          NUXT_ADMIN_TOKEN_SECRET: ${{ secrets.NUXT_ADMIN_TOKEN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload WebKit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-report
          path: playwright-report/
          retention-days: 30
