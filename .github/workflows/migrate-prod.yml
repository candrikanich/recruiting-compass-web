name: Migrate Prod Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

concurrency:
  group: migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to prod
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      - name: Link + push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.PROD_PROJECT_REF }}
          supabase db push
