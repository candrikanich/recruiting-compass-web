name: Memory Soak Tests

on:
  # Nightly — CDP heap/node/listener readings vary run-to-run, so soak tests
  # are unsuitable as a per-PR gate. Runs ONLY the soak specs (SOAK=1), which
  # each self-baseline (baseline→after inside the test), so this job goes red
  # only on a real memory regression — not on unrelated general-suite flakes.
  # General E2E redness / test-isolation debris is tracked as its own effort.
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  # Allow manual triggering from the Actions tab
  workflow_dispatch:

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  soak-tests:
    name: Playwright Memory Soak Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Nuxt
        run: npx nuxi prepare

      - name: Build application
        run: npm run build
        env:
          # Serve a standard Node.js server (precompiled) via nuxi preview, so
          # the soak specs never race first-request route compilation.
          NITRO_PRESET: node-server
          # ssr:false bakes NUXT_PUBLIC_* into the client bundle at build time,
          # so the test project's URL/anon must be present here, not just at run.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      - name: Run soak specs only (SOAK=1)
        run: npx playwright test --project=chromium tests/e2e/athlete-switcher-soak.spec.ts tests/e2e/task-expand-soak.spec.ts
        env:
          CI: true
          SOAK: "1"
          # Soak suite runs against the dedicated test Supabase project, never prod.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          # No NUXT_PUBLIC_ADMIN_HOST — see e2e.yml (loopback carve-out).
          NUXT_ADMIN_TOKEN_SECRET: ${{ secrets.NUXT_ADMIN_TOKEN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-playwright-results
          path: test-results/
          retention-days: 30
