name: Vercel Deployment Cleanup

on:
  # Weekly — prunes old preview/branch deployments so the account stays
  # under Vercel's Hobby-tier storage limit. Never touches aliased/production
  # deployments or the newest 5 per branch (see scripts/vercel-cleanup.mjs).
  schedule:
    - cron: "0 9 * * 0" # Sunday 09:00 UTC
  # Allow manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no deletions)"
        type: boolean
        default: false

jobs:
  cleanup:
    name: Prune old Vercel deployments
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Prune deployments older than 14 days
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_CLEANUP_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--older-than 14"
          if [ "$DRY_RUN" != "true" ]; then
            ARGS="$ARGS --execute"
          fi
          node scripts/vercel-cleanup.mjs $ARGS
