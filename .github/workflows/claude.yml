name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned off the floating @v1 tag: it drifted to a build that hardcodes
        # Claude Code v2.1.79, whose installer 403s from the CDN (curl exit 22),
        # failing the job before Claude runs (upstream issue #1091). v1.0.207 is
        # the current stable release.
        uses: anthropics/claude-code-action@v1.0.207
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Allow Claude to manage issues (create/close/comment/view) and read auth/PR state.
          # Without these, gh issue create/close come back "requires approval" in the
          # non-interactive job and get blocked.
          claude_args: '--allowed-tools "Bash(gh issue create:*),Bash(gh issue close:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh pr:*),Bash(gh auth status:*),Bash(npm run type-check:*),Bash(npm run lint:*),Bash(npm test:*),Bash(npx vitest:*),Bash(npx tsc:*)"'
