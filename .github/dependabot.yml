# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Enable npm dependency updates
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "candrikanich" # Replace with your GitHub username
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group updates to reduce PR noise
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "prettier"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "patch"
    # Ignore major updates for breaking changes - handle manually
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @nuxt/ui 4.x requires Nuxt >=4.1; we run Nuxt 3. Nuxt disables an
      # incompatible module with a WARN and still exits 0, so a 3.x -> 4.x bump
      # ships a build with @nuxt/ui and @nuxt/icon silently missing. Security
      # updates bypass the wildcard major ignore above and target the default
      # branch, so this needs its own entry. Drop it when we move to Nuxt 4.
      - dependency-name: "@nuxt/ui"
        versions: [">=4.0.0"]

  # Enable GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
